<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Yoro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind Configuration -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed": "#7df4ff",
                        "on-tertiary-fixed": "#191c20",
                        "on-secondary-fixed": "#001a41",
                        "on-tertiary": "#2e3135",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#c5c6cc",
                        "surface-container": "#1d2022",
                        "on-tertiary-fixed-variant": "#44474b",
                        "surface-container-lowest": "#0b0f11",
                        "on-primary-fixed": "#002022",
                        "surface-dim": "#101416",
                        "on-secondary-container": "#96b8ff",
                        "secondary-container": "#004698",
                        "surface-container-low": "#191c1e",
                        "surface-bright": "#363a3c",
                        "on-primary-container": "#00676e",
                        "secondary": "#adc6ff",
                        "surface": "#101416",
                        "on-secondary-fixed-variant": "#004494",
                        "error-container": "#93000a",
                        "inverse-surface": "#e0e3e6",
                        "on-background": "#e0e3e6",
                        "tertiary-fixed": "#e1e2e8",
                        "surface-tint": "#5dd8e2",
                        "on-error": "#690005",
                        "inverse-primary": "#006970",
                        "inverse-on-surface": "#2d3133",
                        "on-primary-fixed-variant": "#004f54",
                        "on-tertiary-container": "#595c61",
                        "on-primary": "#00363a",
                        "surface-variant": "#323538",
                        "on-surface": "#e0e3e6",
                        "background": "#101416",
                        "tertiary": "#f0f1f7",
                        "on-surface-variant": "#bcc9ca",
                        "error": "#ffb4ab",
                        "tertiary-container": "#d4d5da",
                        "primary-fixed-dim": "#5dd8e2",
                        "primary": "#ccfaff",
                        "surface-container-highest": "#323538",
                        "outline-variant": "#3d494a",
                        "primary-container": "#6ee7f2",
                        "surface-container-high": "#272a2d",
                        "secondary-fixed": "#d8e2ff",
                        "on-secondary": "#002e69",
                        "outline": "#869394",
                        "on-error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "margin-desktop": "48px",
                        "lg": "24px",
                        "xs": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "xxl": "64px",
                        "md": "16px",
                        "unit": "4px",
                        "xl": "40px",
                        "sm": "8px"
                    },
                    fontFamily: {
                        "body-md": ["Hanken Grotesk"],
                        "label-code": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-technical": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-code": ["11px", { lineHeight: "14px", fontWeight: "400" }],

                }

    <!-- Estilos propios de Yoro -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="w-screen h-screen flex flex-col justify-center items-center">
    <!-- The Void (Container) -->
    <main class="w-full h-full flex flex-col justify-center items-center relative">
        <!-- Centerpiece: Yoro Robot -->
        <div class="yoro-container mb-12">
            <!-- Head -->
            <div class="yoro-head">
                <div class="yoro-face-plate">
                    <div class="yoro-eyes-container">
                        <div class="yoro-eye"></div>
                        <div class="yoro-eye"></div>
                    </div>
                    <div class="yoro-mouth"
                        style="width: auto; height: auto; background-color: transparent; opacity: 0.6;">
                        <div style="display: flex; gap: 0;">
                            <div
                                style="width: 8px; height: 6px; border: 2px solid var(--yoro-border); border-top: 0; border-radius: 0 0 4px 4px;">
                            </div>
                            <div
                                style="width: 8px; height: 6px; border: 2px solid var(--yoro-border); border-top: 0; border-radius: 0 0 4px 4px; margin-left: -2px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Body Structure -->
            <div class="relative flex justify-center w-full">
                <!-- Arms -->
                <div class="yoro-arms"
                    style="position: absolute; top: 60px; width: 160px; display: flex; justify-content: space-between; z-index: 4;">
                    <div class="yoro-arm" style="transform: rotate(15deg);"></div>
                    <div class="yoro-arm" style="transform: rotate(-15deg);"></div>
                </div>
            </div>
        </div>
        <!-- Dialogue -->
        <div class="dialogue-text font-body-lg text-body-lg max-w-md px-gutter">
            <p>"Oh.... No esperaba que alguien entrara."</p>
        </div>
        <!-- Primer juego de Yoro: Adivina el número -->
        <div id="game-ui" class="hidden mt-8 flex flex-col items-center gap-3">
            <input type="number" id="guess-input"
                class="px-3 py-2 rounded-lg text-on-background bg-surface-container border border-outline"
                placeholder="Tu número..." />
            <button id="guess-button"
                class="px-4 py-2 rounded-lg bg-primary-container text-on-primary-container">Adivinar</button>
        </div>

        <!-- Menu: elegir que juego jugar -->
        <div id="game-menu-ui" class="hidden mt-8 flex flex-col items-center gap-3">
        </div>

        <!-- Evento 3: preguntar el nombre -->
        <div id="name-ui" class="hidden mt-8 flex flex-col items-center gap-3">
            <input type="text" id="name-input"
                class="px-3 py-2 rounded-lg text-on-background bg-surface-container border border-outline"
                placeholder="Tu nombre..." />
            <button id="name-button"
                class="px-4 py-2 rounded-lg bg-primary-container text-on-primary-container">Continuar</button>
        </div>
        <!-- Menu: elegir modo de juego -->
        <div id="mode-menu-ui" class="hidden mt-8 flex gap-6">
        </div>
        <!-- Menu: preguntar si el jugador quiere seguir jugando (aparece al repetir un juego) -->
        <div id="continue-menu-ui" class="hidden mt-8 flex gap-4">
            <button id="continue-yes-button"
                class="px-4 py-2 rounded-lg bg-primary-container text-on-primary-container">Sí, vamos</button>
            <button id="continue-later-button"
                class="px-4 py-2 rounded-lg bg-surface-container border border-outline text-on-background">Quizás más
                tarde</button>
        </div>
    </main>

    <!-- Footer -->
    <footer
        class="fixed bottom-2 left-3 text-label-code font-label-code opacity-30 hover:opacity-70 transition-opacity">
        by <a href="https://github.com/YonaZakkart" target="_blank" rel="noopener noreferrer"
            class="underline">YonaZakkart</a>
        · <a href="https://github.com/YonaZakkart/yoro" target="_blank" rel="noopener noreferrer" class="underline">see
            repository</a>
    </footer>

    <!-- Lógica de Yoro -->
    <script src="robot/dialogue.js"></script>
    <script src="games/number.js"></script>
    <script src="games/math.js"></script>
    <script src="storage.js"></script>
    <script src="main.js"></script>
    <script src="events.js"></script>
</body>

</html>
