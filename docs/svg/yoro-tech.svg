<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="Built with HTML5, CSS3, JavaScript and GitHub Pages" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .tile { animation: bob 3.2s ease-in-out infinite; }
    .t2 { animation-delay: -.8s; } .t3 { animation-delay: -1.6s; } .t4 { animation-delay: -2.4s; }
    .box { fill: #0B0F11; stroke: #6EE7F2; stroke-opacity: .35; stroke-width: 2; animation: edge 3.2s ease-in-out infinite; }
    .t2 .box { animation-delay: -.8s; } .t3 .box { animation-delay: -1.6s; } .t4 .box { animation-delay: -2.4s; }
    .g { fill: none; stroke: #6EE7F2; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .n { fill: #6EE7F2; font-family: 'JetBrains Mono',Consolas,monospace; font-weight: 700; text-anchor: middle; }
    .lbl { fill: #E8EAED; opacity: .75; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 13px; text-anchor: middle; letter-spacing: .05em; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes edge { 0%, 100% { stroke-opacity: .3; } 50% { stroke-opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .tile, .box { animation: none; } }
  </style>

  <g transform="translate(100 0)"><g class="tile t1">
    <rect class="box" x="-48" y="20" width="96" height="96" rx="22"/>
    <path class="g" transform="translate(0 68)" d="M-26 -30H26L22 22L0 32L-22 22Z"/>
    <text class="n" x="0" y="80" font-size="26">5</text>
  </g><text class="lbl" y="152">HTML5</text></g>

  <g transform="translate(300 0)"><g class="tile t2">
    <rect class="box" x="-48" y="20" width="96" height="96" rx="22"/>
    <path class="g" transform="translate(0 68)" d="M-26 -30H26L22 22L0 32L-22 22Z"/>
    <text class="n" x="0" y="80" font-size="26">3</text>
  </g><text class="lbl" y="152">CSS3</text></g>

  <g transform="translate(500 0)"><g class="tile t3">
    <rect class="box" x="-48" y="20" width="96" height="96" rx="22"/>
    <rect class="g" x="-28" y="40" width="56" height="56" rx="8"/>
    <text class="n" x="0" y="80" font-size="26">JS</text>
  </g><text class="lbl" y="152">JavaScript</text></g>

  <g transform="translate(700 0)"><g class="tile t4">
    <rect class="box" x="-48" y="20" width="96" height="96" rx="22"/>
    <circle class="g" cx="0" cy="68" r="30"/>
    <path class="g" d="M-12 56H12M-12 68H12M-12 80H4"/>
  </g><text class="lbl" y="152">GitHub Pages</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
