<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="420" height="150" role="img" aria-label="Play Game" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .ring { fill: none; stroke: #6EE7F2; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .ring2 { animation-delay: 1.2s; }
    .btn { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
    .shine { animation: shine 3.6s ease-in-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.16, 1.45); opacity: 0; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes shine { 0%, 55% { transform: translateX(-120px); } 100% { transform: translateX(460px); } }
    @media (prefers-reduced-motion: reduce) { .ring, .btn, .shine { animation: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FF3FA"/>
      <stop offset=".55" stop-color="#5DD8E2"/>
      <stop offset="1" stop-color="#3FB9C4"/>
    </linearGradient>
    <clipPath id="clip"><rect x="40" y="31" width="340" height="88" rx="28"/></clipPath>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect x="40" y="31" width="340" height="88" rx="28" fill="#6EE7F2" opacity=".35" filter="url(#glow)"/>
  <rect class="ring" x="40" y="31" width="340" height="88" rx="28"/>
  <rect class="ring ring2" x="40" y="31" width="340" height="88" rx="28"/>
  <g class="btn">
    <rect x="40" y="37" width="340" height="88" rx="28" fill="#1F6E75"/>
    <rect x="40" y="31" width="340" height="88" rx="28" fill="url(#g)" stroke="#2E9AA3" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <rect class="shine" x="0" y="20" width="36" height="120" fill="#fff" opacity=".35" transform="skewX(-20)"/>
    </g>
    <path d="M104 62L104 88L127 75Z" fill="#00363A" stroke="#00363A" stroke-width="6" stroke-linejoin="round"/>
    <text x="250" y="86" text-anchor="middle" font-family="'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#00363A">PLAY GAME</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
