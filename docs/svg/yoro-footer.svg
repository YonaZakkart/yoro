<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="By YonaZakkart. Assisted by Claude. Redesign by YamiNeco." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .core  { animation: pulse 3s ease-in-out infinite; }
    .wave  { transform-origin: 392px 347px; animation: wave 1.6s ease-in-out infinite; }
    .by    { font-family: 'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif; font-size: 28px; font-weight: 600; fill: #E8EAED; }
    .ai    { font-family: 'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif; font-size: 16px; fill: #6EE7F2; opacity: .9; }
    .tiny  { font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; fill: #E8EAED; opacity: .5; letter-spacing: .03em; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes pulse { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    @keyframes wave  { 0%,100% { transform: rotate(-128deg); } 50% { transform: rotate(-96deg); } }
    @media (prefers-reduced-motion: reduce) { .float, .eye, .core, .wave { animation: none; } }
  </style>
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#6EE7F2" stop-opacity=".22"/><stop offset="1" stop-color="#6EE7F2" stop-opacity="0"/></radialGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="896" height="256" rx="22" fill="#050505" stroke="#6EE7F2" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="776" cy="130" r="150" fill="url(#halo)"/>

  <text class="by" x="60" y="104">By YonaZakkart</text>
  <text class="ai" x="60" y="136">assisted by Claude</text>
  <text class="tiny" x="60" y="160">Opus 5.5 in Devin-ai-cli</text>
  <text class="tiny" x="60" y="190">Redesign by YamiNeco</text>

  <g transform="translate(634 -23) scale(.46)">
    <ellipse cx="306" cy="588" rx="170" ry="22" fill="url(#floor)"/>
    <g class="float">
      <!-- arms: right one waves -->
      <g stroke-linecap="round">
        <line x1="222" y1="347" x2="193" y2="405" stroke="#6b6d72" stroke-width="35"/>
        <line x1="222" y1="347" x2="193" y2="405" stroke="#23252e" stroke-width="29"/>
        <g class="wave">
          <line x1="392" y1="347" x2="421" y2="405" stroke="#6b6d72" stroke-width="35"/>
          <line x1="392" y1="347" x2="421" y2="405" stroke="#23252e" stroke-width="29"/>
        </g>
      </g>
      <rect x="243" y="484" width="36" height="92" rx="18" fill="#23252e" stroke="#6b6d72" stroke-width="3"/>
      <rect x="331" y="484" width="36" height="92" rx="18" fill="#23252e" stroke="#6b6d72" stroke-width="3"/>
      <path d="M221 440 C240 488 376 488 393 440 L308 466 Z" fill="#000"/>
      <path d="M237 322 L374 322 L400 440 L308 466 L214 440 Z" fill="#23252e" stroke="#6b6d72" stroke-width="3" stroke-linejoin="round"/>
      <path d="M254 338 L359 338 L376 426 L306 448 L237 427 Z" fill="#121316"/>
      <path class="core" d="M306 355 L330 387 L282 387 Z" fill="#1cf0f8" stroke="#1cf0f8" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
      <rect x="143" y="89" width="328" height="233" rx="78" fill="#23252e" stroke="#6b6d72" stroke-width="4"/>
      <rect x="177" y="135" width="259" height="142" rx="52" fill="#121316"/>
      <rect class="eye" x="221" y="166" width="56" height="38" rx="19" fill="#1cf0f8" filter="url(#glow)"/>
      <rect class="eye" x="334" y="166" width="56" height="38" rx="19" fill="#1cf0f8" filter="url(#glow)"/>
      <!-- happy mouth -->
      <path d="M288 233 Q297 247 306 233 Q315 247 324 233 C324 266 288 266 288 233 Z" fill="none" stroke="#6e7074" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
