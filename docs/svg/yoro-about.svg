<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="About Yoro" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .shell { fill: #23272D; stroke: #6E7278; stroke-width: 12; }
    .plate { fill: #121315; stroke: #1a1d21; stroke-width: 4; }
    .eye { fill: #1BEAF5; transform-box: fill-box; transform-origin: 50% 100%; animation: blink 5s infinite; }
    .mouth { fill: none; stroke: #454A50; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .head { animation: float 3.4s ease-in-out infinite; }
    .title { font-family: 'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif; font-size: 27px; font-weight: 600; fill: #E8EAED; }
    .body { font-family: 'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif; font-size: 16px; fill: #6EE7F2; }
    .small { font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; fill: #E8EAED; opacity: .5; letter-spacing: .04em; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.07); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .head, .eye { animation: none; } }
  </style>
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#6EE7F2" stop-opacity=".22"/><stop offset="1" stop-color="#6EE7F2" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect x="2" y="2" width="896" height="246" rx="22" fill="#050505" stroke="#6EE7F2" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="145" cy="108" r="120" fill="url(#halo)"/>
  <g transform="translate(48 1) scale(.16)"><g class="head">
    <rect class="shell" x="73" y="245" width="1040" height="768" rx="294"/>
    <rect class="plate" x="181" y="391" width="822" height="448" rx="148"/>
    <rect x="323" y="489" width="178" height="114" rx="57" fill="#1BEAF5" filter="url(#glow)"/>
    <rect x="683" y="489" width="178" height="114" rx="57" fill="#1BEAF5" filter="url(#glow)"/>
    <rect class="eye" x="323" y="489" width="178" height="114" rx="57"/>
    <rect class="eye" x="683" y="489" width="178" height="114" rx="57"/>
    <path class="mouth" d="M545 726Q569 748 593 726Q617 748 641 726C641 798 545 798 545 726Z"/>
  </g></g>
  <text class="title" x="310" y="84">A little robot that dreams of</text>
  <text class="title" x="310" y="120">making wonderful games.</text>
  <text class="body" x="310" y="164">Why not keep him company for a few minutes? He'll be happy.</text>
  <text class="small" x="450" y="228" text-anchor="middle">Yoro is a small learning and practice project.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
