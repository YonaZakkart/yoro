<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" xml:lang="es" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Yoro: the little robot that makes games</title>
  <desc id="d">Banner de Yoro, un pequeño robot de ojos cian, con el título y los tres minijuegos: Adivina el Número, Cuenta Conmigo y Ahorcado.</desc>

  <defs>
    <!-- Resplandor turquesa detrás de Yoro -->
    <radialGradient id="bgGlow" cx="300" cy="350" r="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c6469"/>
      <stop offset="0.5" stop-color="#084a4e"/>
      <stop offset="0.78" stop-color="#052c2e"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <!-- Sombra del suelo -->
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .core  { animation: pulse 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .float, .eye, .core { animation: none; } }
  </style>

  <!-- Fondo (#050505 = theme-color de la página) -->
  <rect width="1280" height="640" fill="#050505"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>

  <!-- Sombra bajo Yoro -->
  <ellipse cx="306" cy="588" rx="170" ry="22" fill="url(#floor)"/>

  <!-- ============ YORO ============ -->
  <g class="float">
    <!-- brazos -->
    <g stroke-linecap="round">
      <line x1="222" y1="347" x2="193" y2="405" stroke="#6b6d72" stroke-width="35"/>
      <line x1="222" y1="347" x2="193" y2="405" stroke="#23252e" stroke-width="29"/>
      <line x1="392" y1="347" x2="421" y2="405" stroke="#6b6d72" stroke-width="35"/>
      <line x1="392" y1="347" x2="421" y2="405" stroke="#23252e" stroke-width="29"/>
    </g>
    <!-- piernas -->
    <rect x="243" y="484" width="36" height="92" rx="18" fill="#23252e" stroke="#6b6d72" stroke-width="3"/>
    <rect x="331" y="484" width="36" height="92" rx="18" fill="#23252e" stroke="#6b6d72" stroke-width="3"/>
    <!-- cadera -->
    <path d="M221 440 C240 488 376 488 393 440 L308 466 Z" fill="#000"/>
    <!-- cuerpo -->
    <path d="M237 322 L374 322 L400 440 L308 466 L214 440 Z" fill="#23252e" stroke="#6b6d72" stroke-width="3" stroke-linejoin="round"/>
    <path d="M254 338 L359 338 L376 426 L306 448 L237 427 Z" fill="#121316"/>
    <!-- núcleo -->
    <path class="core" d="M306 355 L330 387 L282 387 Z" fill="#1cf0f8" stroke="#1cf0f8" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- cabeza -->
    <rect x="143" y="89" width="328" height="233" rx="78" fill="#23252e" stroke="#6b6d72" stroke-width="4"/>
    <rect x="177" y="135" width="259" height="142" rx="52" fill="#121316"/>
    <!-- ojos -->
    <rect class="eye" x="221" y="166" width="56" height="38" rx="19" fill="#1cf0f8" filter="url(#glow)"/>
    <rect class="eye" x="334" y="166" width="56" height="38" rx="19" fill="#1cf0f8" filter="url(#glow)"/>
    <!-- boca ω -->
    <path d="M289 231 Q289 247 297.5 247 Q306 247 306 238 Q306 247 314.5 247 Q323 247 323 231" fill="none" stroke="#6e7074" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ TÍTULO (letras dibujadas como trazados) ============ -->
  <g fill="#118790" fill-rule="evenodd">
    <!-- Y -->
    <path d="M670 134 L728 132 L745 178 L762 132 L820 134 L800 166 L788 164 L760 214 L760 262 L745 294 L730 262 L730 214 L702 164 L690 166 Z"/>
    <!-- O -->
    <path id="letterO" d="M834 138 L862 132 L898 132 L928 138 L936 160 L929 205 L937 250 L927 276 L898 282 L880 297 L862 282 L832 276 L825 250 L831 205 L825 160 Z
                         M856 154 L904 150 L902 252 L858 258 Z"/>
    <!-- R -->
    <path d="M952 134 L1040 132 L1067 148 L1075 188 L1063 212 L1043 224 L1070 262 L1078 284 L1042 281 L1004 232 L996 232 L996 268 L1013 282 L956 286 L968 268 L968 150 Z
             M996 152 L1036 152 L1047 188 L1036 208 L996 208 Z"/>
    <!-- O -->
    <use href="#letterO" transform="translate(262 0)"/>
  </g>

  <!-- Eslogan -->
  <text x="930" y="372" text-anchor="middle" font-size="40" font-weight="700" fill="#8a8c8e"
        font-family="'Pirata One','UnifrakturCook','Almendra',Georgia,'Times New Roman',serif"
        textLength="620" lengthAdjust="spacingAndGlyphs">The little robot that makes games</text>

  <!-- Minijuegos de la página -->
  <g font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#9fe3e8">
    <rect x="620" y="420" width="232" height="48" rx="24" fill="#0a1a1c" stroke="#118790" stroke-width="1.5"/>
    <circle cx="644" cy="444" r="5" fill="#1cf0f8" filter="url(#softGlow)"/>
    <text x="658" y="450.5">Adivina el Número</text>

    <rect x="864" y="420" width="218" height="48" rx="24" fill="#0a1a1c" stroke="#118790" stroke-width="1.5"/>
    <circle cx="888" cy="444" r="5" fill="#1cf0f8" filter="url(#softGlow)"/>
    <text x="902" y="450.5">Cuenta Conmigo</text>

    <rect x="1094" y="420" width="146" height="48" rx="24" fill="#0a1a1c" stroke="#118790" stroke-width="1.5"/>
    <circle cx="1118" cy="444" r="5" fill="#1cf0f8" filter="url(#softGlow)"/>
    <text x="1132" y="450.5">Ahorcado</text>
  </g>

  <!-- Pie -->
  <text x="930" y="530" text-anchor="middle" font-size="20" letter-spacing="1" fill="#6f7478"
        font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">ES · EN  |  yonazakkart.github.io/yoro</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
