<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Yoro's games" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .card { fill: #050505; stroke: #6EE7F2; stroke-opacity: .35; stroke-width: 2; }
    .ico { fill: #6EE7F2; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 30px; font-weight: 700; text-anchor: middle; animation: pop 3s ease-in-out infinite; }
    .c2 .ico { animation-delay: -1s; } .c3 .ico { animation-delay: -2s; }
    .name { fill: #E8EAED; font-family: 'Hanken Grotesk','Segoe UI',Helvetica,Arial,sans-serif; font-size: 21px; font-weight: 600; text-anchor: middle; }
    .chip { fill: #1A1D20; stroke: #454A50; stroke-width: 1.5; }
    .chipt { fill: #6EE7F2; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; text-anchor: middle; }
    .desc { fill: #E8EAED; opacity: .7; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; text-anchor: middle; }
    @keyframes pop { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ico { animation: none; } }
  </style>

  <g class="c1" transform="translate(30 0)">
    <rect class="card" x="1" y="1" width="268" height="268" rx="20"/>
    <text class="ico" x="135" y="62">?</text>
    <text class="name" x="135" y="104">Guess the Number</text>
    <g transform="translate(61 124)">
      <rect class="chip" width="60" height="26" rx="13"/><text class="chipt" x="30" y="17">Casual</text>
      <rect class="chip" x="68" width="80" height="26" rx="13"/><text class="chipt" x="108" y="17">Challenge</text>
    </g>
    <text class="desc" x="135" y="190">Find the secret number.</text>
    <text class="desc" x="135" y="210">Hints get warmer as you</text>
    <text class="desc" x="135" y="230">get closer.</text>
  </g>

  <g class="c2" transform="translate(315 0)">
    <rect class="card" x="1" y="1" width="268" height="268" rx="20"/>
    <text class="ico" x="135" y="62">+ −</text>
    <text class="name" x="135" y="104">Count With Me</text>
    <g transform="translate(64 124)">
      <rect class="chip" width="60" height="26" rx="13"/><text class="chipt" x="30" y="17">Casual</text>
      <rect class="chip" x="68" width="74" height="26" rx="13"/><text class="chipt" x="105" y="17">Infinite</text>
    </g>
    <text class="desc" x="135" y="190">Quick sums and</text>
    <text class="desc" x="135" y="210">subtractions with Yoro.</text>
    <text class="desc" x="135" y="230">How long can you last?</text>
  </g>

  <g class="c3" transform="translate(600 0)">
    <rect class="card" x="1" y="1" width="268" height="268" rx="20"/>
    <text class="ico" x="135" y="62">_ _ _</text>
    <text class="name" x="135" y="104">Hangman</text>
    <g transform="translate(27 124)">
      <rect class="chip" width="60" height="26" rx="13"/><text class="chipt" x="30" y="17">Casual</text>
      <rect class="chip" x="68" width="80" height="26" rx="13"/><text class="chipt" x="108" y="17">Challenge</text>
      <rect class="chip" x="156" width="60" height="26" rx="13"/><text class="chipt" x="186" y="17">Expert</text>
    </g>
    <text class="desc" x="135" y="190">Guess letter by letter</text>
    <text class="desc" x="135" y="210">or go for the whole word.</text>
    <text class="desc" x="135" y="230">Lives are limited.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
